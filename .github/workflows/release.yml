name: AuditFlow Controlled Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production
      release_id:
        description: Release identifier to expose in /health and /ready
        required: true
        type: string
      commit_sha:
        description: Commit SHA being deployed
        required: true
        type: string
      approval_reference:
        description: Approved change / release approval reference
        required: true
        type: string

jobs:
  release-checks:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies from committed lockfile
        run: |
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Approved change
        run: |
          echo "Approved change reference: ${{ inputs.approval_reference }}"
          echo "Release ID: ${{ inputs.release_id }}"
          echo "Commit SHA: ${{ inputs.commit_sha }}"

      - name: Quality gates
        run: pnpm ci

      - name: Production strict non-functional gate
        if: ${{ inputs.environment == 'production' }}
        run: |
          pnpm gate:production-strict
          test -n "$PRODUCTION_GATE_APPROVAL_REFERENCE"
          test "$CUSTOMER_EVIDENCE_ENABLED" = "true"
        env:
          PRODUCTION_GATE_APPROVAL_REFERENCE: ${{ secrets.PRODUCTION_GATE_APPROVAL_REFERENCE }}
          CUSTOMER_EVIDENCE_ENABLED: ${{ secrets.CUSTOMER_EVIDENCE_ENABLED }}

      - name: Backup verification
        run: |
          echo "Verify managed database backup/PITR and latest restore test before production migration."
          echo "Record result in ops/release/release-audit-record-template.md or the environment-specific release record."

      - name: Controlled migration
        run: |
          pnpm db:validate
          pnpm db:generate
          pnpm ci:migration-validate
          echo "Apply Prisma migrations through the approved release procedure."
          echo "Do not edit already-applied production migrations; use a forward corrective migration."

      - name: Backend deploy
        run: |
          echo "Deploy backend artifact for ${{ inputs.environment }} with RELEASE_ID=${{ inputs.release_id }} and COMMIT_SHA=${{ inputs.commit_sha }}."

      - name: Health and readiness checks
        run: |
          pnpm auth:rbac:verify
          pnpm framework:reconciliation:verify
          pnpm evidence:upload:security:verify
          pnpm evidence:review:readiness:verify
          pnpm core:workflow:verify
          pnpm api:contract:verify
          pnpm frontend:runtime:verify
          pnpm security:acceptance:verify
          pnpm ai:safety:verify
          pnpm jobs:notifications:verify
          pnpm auditor:grants:verify
          pnpm retention:deletion:verify
          pnpm operations:recovery:verify
          pnpm release:discipline:verify
          echo "Check /health for release ID and commit SHA."
          echo "Check /ready for database and enabled worker dependencies."

      - name: Frontend deploy
        run: |
          echo "Deploy frontend artifact after backend health/readiness succeeds."

      - name: Critical workflow smoke test
        run: |
          pnpm ci:staging-smoke-contract
          echo "Execute the deployed critical workflow smoke checklist for ${{ inputs.environment }}."

      - name: Release audit record
        run: |
          echo "Store approved change, backup verification, controlled migration, backend deploy, /health, /ready, frontend deploy, critical workflow smoke test, and release audit record."
